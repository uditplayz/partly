# Production-shaped stack: web + worker + beat on one Postgres and one Redis.
#   cp .env.production.example .env.production   (then fill it in)
#   docker compose up -d --build
# Caddy terminates HTTPS on ports 80/443 and proxies to the web container (never exposed directly).
# Set DOMAIN in .env.production (and POSTGRES_PASSWORD in your shell).
x-app: &app
  build: .
  image: partly:latest
  env_file: .env.production
  environment:
    DATABASE_URL: postgres://partly:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/partly
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: partly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: partly
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partly -d partly"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"

  web:
    <<: *app
    command: ["web"]
    expose: ["8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  caddy:
    image: caddy:2-alpine
    env_file: .env.production
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck: {disable: true}

  beat:
    <<: *app
    command: ["beat"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck: {disable: true}

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
