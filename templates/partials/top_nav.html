{% load ui %}
<header class="top-nav">
  <div class="container-narrow top-nav__inner">
    <a class="brand" href="{% url 'core:home' %}" aria-label="Partly home">
      <span class="brand__dot" aria-hidden="true"></span>partly
    </a>
    <nav class="top-nav__links d-none d-md-flex" aria-label="Primary">
      <a class="top-nav__link {% nav_active 'core:home' %}" href="{% url 'core:home' %}">Explore</a>
      <a class="top-nav__link {% nav_active 'core:host' %}" href="{% url 'core:host' %}">Host</a>
      <a class="top-nav__link {% nav_active 'core:tickets' %}" href="{% url 'core:tickets' %}">My Tickets</a>
      {% if user.is_authenticated %}
        <a class="top-nav__link {% nav_active 'accounts:profile' %}" href="{% url 'accounts:profile' %}">
          <span class="avatar avatar--sm" aria-hidden="true">{{ user.initials }}</span>{{ user.name }}
        </a>
      {% else %}
        <a class="btn btn-sm btn-primary rounded-pill px-3" href="{% url 'accounts:login' %}">Log in</a>
      {% endif %}
    </nav>
    {% if not user.is_authenticated %}
      <a class="btn btn-sm btn-outline-primary rounded-pill px-3 d-md-none" href="{% url 'accounts:login' %}">Log in</a>
    {% endif %}
  </div>
</header>
