{% extends "base.html" %}
{% block title %}Offline · {{ SITE_NAME }}{% endblock %}
{% block content %}
  <div class="p-card empty-state mt-4">
    <div class="empty-state__art empty-state__art--offline" aria-hidden="true"><span></span><span></span><span></span></div>
    <h1 class="h4">You're offline</h1>
    <p class="text-secondary">No signal right now. Pages you've opened before, including your tickets, still work.</p>
    <div class="d-flex gap-2 justify-content-center flex-wrap">
      <a class="btn btn-primary rounded-pill px-4" href="{% url 'core:tickets' %}">Open My Tickets</a>
      <button type="button" class="btn btn-outline-primary rounded-pill px-4" onclick="location.reload()">Try again</button>
    </div>
  </div>
{% endblock %}
