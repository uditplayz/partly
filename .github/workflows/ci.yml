name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway database that only exists inside this job and is not reachable from outside.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/partly
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      # Exact versions with hashes, wheels only, so no package setup script runs in CI.
      - run: pip install --require-hashes --only-binary :all: -r requirements-dev.lock
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Production settings pass Django's deploy checks
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          ALLOWED_HOSTS: partly.example
          REDIS_URL: redis://localhost:6379/0
          PAYMENT_PROVIDER: razorpay
          RAZORPAY_KEY_ID: ci
          RAZORPAY_KEY_SECRET: ci
          RAZORPAY_WEBHOOK_SECRET: ci
      - name: Tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The production image builds (wheels only, hashes checked, collectstatic runs)
        run: docker build -t partly:ci .
